name: Deploy via ftp
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O site é estático: monta a pasta dist só com o que vai para o ar
      - name: Montar pasta dist
        run: |
          mkdir dist
          cp index.html dist/
          cp -r css js fonts img dist/

      - name: FTP Deploy Locaweb
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "dist"
          remoteDir: "public_html/tramartss"
